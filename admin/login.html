<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Anand Kumar</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="admin-logo">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h1>Admin Login</h1>
            <p class="subtitle">
                Welcome back! Please login to manage your portfolio.
            </p>

            <!-- Login Message -->
            <div id="loginMessage" class="login-message" style="display: none;"></div>

            <!-- Login Form -->
            <form id="adminLoginForm" action="auth.php" method="POST">
                <!-- Email -->
                <div class="input-group">
                    <label for="email">
                        <i class="fa-solid fa-envelope"></i>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="admin@gmail.com" required autocomplete="email">
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">
                        <i class="fa-solid fa-lock"></i>
                        Password
                    </label>
                    <div class="password-box">
                        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-password" title="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn" id="loginBtn">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Back to Portfolio -->
            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Portfolio</span>
            </a>
        </div>
    </div>

    <!-- Admin JavaScript -->
    <script src="admin.js"></script>

</body>

</html>
